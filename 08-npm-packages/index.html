<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yatmo example: @yatmo/maps in the browser</title>
  <link rel="stylesheet" href="../shared.css">
  <style>#map { width: 100%; height: 480px; }</style>
</head>
<body>
  <header>
    <h1>@yatmo/maps from npm</h1>
    <p>The same plugins as the other examples, loaded through the typed npm package. Here it is imported from a CDN
      so the page runs without a bundler; with a bundler, <code>npm install @yatmo/maps</code> and import it.
      <a href="https://www.npmjs.com/package/@yatmo/maps">Package</a></p>
  </header>
  <main>
    <div id="iframe"></div>
    <h3>JavaScript map</h3>
    <div id="map"></div>
    <h3>Neighbourhood text</h3>
    <article id="text"></article>
  </main>
  <script src="../config.js"></script>
  <script type="module">
    import { mountIframe, mountMap, mountSummaryText } from 'https://esm.sh/@yatmo/maps@1';

    mountIframe('iframe', { ...YATMO, mode: 'summary-tabs', height: 420 });
    await mountMap({ licenseKey: YATMO.licenseKey, country: YATMO.country, language: YATMO.language, container: 'map', center: [YATMO.longitude, YATMO.latitude], zoom: 16 });
    await mountSummaryText({ licenseKey: YATMO.licenseKey, country: YATMO.country, language: YATMO.language, latitude: YATMO.latitude, longitude: YATMO.longitude }, { container: 'text' });
  </script>
</body>
</html>
