<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yatmo example: web components, no framework</title>
  <link rel="stylesheet" href="../shared.css">
  <style>
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    yatmo-pois ul { padding-left: 18px; margin: 0 0 12px; }
  </style>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@yatmo/elements@1/dist/yatmo-elements.js"></script>
</head>
<body>
  <header>
    <h1>Web components: one script, three HTML elements</h1>
    <p>No framework, no build step: the map, the nearest places and the neighbourhood text of a property with
      <code>&lt;yatmo-map&gt;</code>, <code>&lt;yatmo-pois&gt;</code> and <code>&lt;yatmo-text&gt;</code>. The key,
      country and language come from one <code>&lt;yatmo-config&gt;</code>.
      <a href="https://www.npmjs.com/package/@yatmo/elements">Package</a></p>
  </header>
  <main>
    <yatmo-config id="config" country="BE" language="EN"></yatmo-config>
    <div class="grid">
      <div>
        <yatmo-map latitude="50.8461" longitude="4.3664" mode="overlay" marker="circle" circle-radius="300" isochrone="right" height="520"></yatmo-map>
      </div>
      <aside>
        <h2>Around the property</h2>
        <yatmo-pois latitude="50.8461" longitude="4.3664" categories="education,shopping,transport" mode="walking"></yatmo-pois>
      </aside>
    </div>
    <h2>Living here</h2>
    <yatmo-text latitude="50.8461" longitude="4.3664" titles="city"></yatmo-text>
  </main>
  <script src="../config.js"></script>
  <script>
    // The shared config of the examples feeds <yatmo-config>; on your site, write the key in the attribute.
    document.getElementById('config').setAttribute('key', YATMO.licenseKey);
  </script>
</body>
</html>
